<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 300">

  <rect width="1000" height="300"
        rx="28"
        fill="#0d1117"/>

  <text x="500" y="60"
        text-anchor="middle"
        fill="#b56cff"
        font-family="monospace"
        font-size="28"
        font-weight="bold">
    UI ANIMATION LAB
  </text>

  <rect x="100" y="115"
        width="800"
        height="35"
        rx="17"
        fill="#161b22"/>

  <rect x="100" y="115"
        width="200"
        height="35"
        rx="17"
        fill="#b56cff">

    <animate
      attributeName="width"
      values="100;700;300;800;100"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>

  <text x="500" y="205"
        text-anchor="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="18">
    BUILDING INTERFACE...

    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </text>

</svg>
