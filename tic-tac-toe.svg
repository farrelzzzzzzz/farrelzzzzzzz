<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 360">

  <rect width="600" height="360"
        rx="28"
        fill="#0d1117"/>

  <text x="300" y="45"
        text-anchor="middle"
        fill="#b56cff"
        font-family="monospace"
        font-size="27"
        font-weight="bold">
    TIC-TAC-TOE
  </text>

  <g stroke="#30363d" stroke-width="5">

    <line x1="220" y1="80"
          x2="220" y2="290"/>

    <line x1="380" y1="80"
          x2="380" y2="290"/>

    <line x1="140" y1="150"
          x2="460" y2="150"/>

    <line x1="140" y1="220"
          x2="460" y2="220"/>

  </g>

  <text x="180" y="135"
        fill="#ffffff"
        font-family="monospace"
        font-size="42">
    X

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.6s"
      repeatCount="indefinite"/>

  </text>

  <text x="260" y="135"
        fill="#b56cff"
        font-family="monospace"
        font-size="42">

    O

    <animate
      attributeName="opacity"
      values="0;1"
      begin="0.5s"
      dur="0.6s"
      repeatCount="indefinite"/>

  </text>

  <text x="340" y="205"
        fill="#ffffff"
        font-family="monospace"
        font-size="42">

    X

    <animate
      attributeName="opacity"
      values="0;1"
      begin="1s"
      dur="0.6s"
      repeatCount="indefinite"/>

  </text>

  <text x="420" y="275"
        fill="#b56cff"
        font-family="monospace"
        font-size="42">

    O

    <animate
      attributeName="opacity"
      values="0;1"
      begin="1.5s"
      dur="0.6s"
      repeatCount="indefinite"/>

  </text>

  <text x="300" y="330"
        text-anchor="middle"
        fill="#8b949e"
        font-family="monospace"
        font-size="14">
    PLAYER TURN
  </text>

</svg>
