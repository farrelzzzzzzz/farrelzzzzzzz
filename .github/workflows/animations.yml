name: Build All Animated Portfolio Assets

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: animations-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # MAIN
      # ==========================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # ==========================================================
      # PREPARE
      # ==========================================================

      - name: Prepare generated folder
        run: |
          rm -rf generated
          mkdir -p generated


      # ==========================================================
      # CONTRIBUTION SNAKE
      # ==========================================================

      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: farrelzzzzzzz
          outputs: |
            generated/github-contribution-grid-snake.svg
            generated/github-contribution-grid-snake-dark.svg?palette=github-dark


      # ==========================================================
      # ARCADE
      # ==========================================================

      - name: Generate Arcade Animation
        run: |
          cat > generated/game-arcade.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 1000 340">

            <rect width="1000" height="340" rx="30" fill="#0d1117"/>

            <rect x="20" y="20"
                  width="960" height="300"
                  rx="25"
                  fill="none"
                  stroke="#b56cff"
                  stroke-width="2"/>

            <text x="500" y="65"
                  text-anchor="middle"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="34"
                  font-weight="bold">
              FARREL ARCADE
            </text>

            <text x="500" y="98"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-family="monospace"
                  font-size="15">
              SELECT • PLAY • EXPLORE
            </text>

            <g fill="#ffffff"
               font-family="monospace"
               font-size="19"
               text-anchor="middle">

              <text x="130" y="170">🐍 SNAKE</text>
              <text x="350" y="170">❌⭕ TIC-TAC-TOE</text>
              <text x="650" y="170">🏓 PONG</text>
              <text x="870" y="170">🧱 BREAKOUT</text>

            </g>

            <rect x="130" y="205"
                  width="740"
                  height="4"
                  fill="#161b22"/>

            <rect x="130" y="205"
                  width="100"
                  height="4"
                  fill="#b56cff">

              <animate
                attributeName="x"
                values="130;740;130"
                dur="3s"
                repeatCount="indefinite"/>

            </rect>

            <circle cx="430" cy="260" r="6"
                    fill="#b56cff">

              <animate
                attributeName="opacity"
                values="1;0.15;1"
                dur="1s"
                repeatCount="indefinite"/>

            </circle>

            <text x="450" y="266"
                  fill="#8b949e"
                  font-family="monospace"
                  font-size="16">
              ARCADE ONLINE
            </text>

          </svg>
          EOF


      # ==========================================================
      # SNAKE GAME
      # ==========================================================

      - name: Generate Snake Game Animation
        run: |
          cat > generated/snake-game.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 700 360">

            <rect width="700" height="360"
                  rx="28"
                  fill="#0d1117"/>

            <text x="350" y="45"
                  text-anchor="middle"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="27"
                  font-weight="bold">
              SNAKE GAME
            </text>

            <rect x="100" y="75"
                  width="500"
                  height="230"
                  rx="10"
                  fill="#161b22"
                  stroke="#30363d"
                  stroke-width="2"/>

            <!-- food -->

            <circle cx="500" cy="130"
                    r="9"
                    fill="#b56cff">

              <animate
                attributeName="r"
                values="7;12;7"
                dur="0.8s"
                repeatCount="indefinite"/>

            </circle>

            <!-- snake -->

            <rect x="160" y="220"
                  width="30"
                  height="30"
                  rx="5"
                  fill="#ffffff">

              <animate
                attributeName="x"
                values="160;220;280;340;400;460;400;340;280;220;160"
                dur="6s"
                repeatCount="indefinite"/>

            </rect>

            <rect x="130" y="220"
                  width="30"
                  height="30"
                  rx="5"
                  fill="#b56cff">

              <animate
                attributeName="x"
                values="130;190;250;310;370;430;370;310;250;190;130"
                dur="6s"
                repeatCount="indefinite"/>

            </rect>

            <rect x="100" y="220"
                  width="30"
                  height="30"
                  rx="5"
                  fill="#8b949e">

              <animate
                attributeName="x"
                values="100;160;220;280;340;400;340;280;220;160;100"
                dur="6s"
                repeatCount="indefinite"/>

            </rect>

            <text x="350" y="335"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-family="monospace"
                  font-size="14">
              SCORE 002320 • PLAYER 1
            </text>

          </svg>
          EOF


      # ==========================================================
      # TIC TAC TOE
      # ==========================================================

      - name: Generate Tic Tac Toe Animation
        run: |
          cat > generated/tic-tac-toe.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 600 360">

            <rect width="600" height="360"
                  rx="28"
                  fill="#0d1117"/>

            <text x="300" y="45"
                  text-anchor="middle"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="27"
                  font-weight="bold">
              TIC-TAC-TOE
            </text>

            <g stroke="#30363d" stroke-width="5">

              <line x1="220" y1="80"
                    x2="220" y2="290"/>

              <line x1="380" y1="80"
                    x2="380" y2="290"/>

              <line x1="140" y1="150"
                    x2="460" y2="150"/>

              <line x1="140" y1="220"
                    x2="460" y2="220"/>

            </g>

            <text x="180" y="135"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="42">
              X

              <animate
                attributeName="opacity"
                values="0;1"
                dur="0.6s"
                repeatCount="indefinite"/>

            </text>

            <text x="260" y="135"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="42">

              O

              <animate
                attributeName="opacity"
                values="0;1"
                begin="0.5s"
                dur="0.6s"
                repeatCount="indefinite"/>

            </text>

            <text x="340" y="205"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="42">

              X

              <animate
                attributeName="opacity"
                values="0;1"
                begin="1s"
                dur="0.6s"
                repeatCount="indefinite"/>

            </text>

            <text x="420" y="275"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="42">

              O

              <animate
                attributeName="opacity"
                values="0;1"
                begin="1.5s"
                dur="0.6s"
                repeatCount="indefinite"/>

            </text>

            <text x="300" y="330"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-family="monospace"
                  font-size="14">
              PLAYER TURN
            </text>

          </svg>
          EOF


      # ==========================================================
      # PONG
      # ==========================================================

      - name: Generate Pong Animation
        run: |
          cat > generated/pong-game.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 800 400">

            <rect width="800" height="400"
                  rx="28"
                  fill="#0d1117"/>

            <text x="400" y="45"
                  text-anchor="middle"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="28"
                  font-weight="bold">
              PONG
            </text>

            <rect x="70" y="75"
                  width="660"
                  height="270"
                  rx="10"
                  fill="#161b22"
                  stroke="#30363d"
                  stroke-width="2"/>

            <!-- center line -->

            <path d="M400 85 V335"
                  stroke="#30363d"
                  stroke-width="3"
                  stroke-dasharray="12 12"/>

            <!-- paddles -->

            <rect x="95" y="180"
                  width="15"
                  height="70"
                  rx="5"
                  fill="#ffffff">

              <animate
                attributeName="y"
                values="100;245;150;100"
                dur="3s"
                repeatCount="indefinite"/>

            </rect>

            <rect x="690" y="180"
                  width="15"
                  height="70"
                  rx="5"
                  fill="#b56cff">

              <animate
                attributeName="y"
                values="245;100;220;245"
                dur="3s"
                repeatCount="indefinite"/>

            </rect>

            <!-- ball -->

            <circle cx="400" cy="210"
                    r="9"
                    fill="#b56cff">

              <animate
                attributeName="cx"
                values="120;680;120"
                dur="2.4s"
                repeatCount="indefinite"/>

              <animate
                attributeName="cy"
                values="210;110;280;210"
                dur="2.4s"
                repeatCount="indefinite"/>

            </circle>

            <text x="400" y="375"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-family="monospace"
                  font-size="14">
              PLAYER 01     07 : 05     PLAYER 02
            </text>

          </svg>
          EOF


      # ==========================================================
      # BREAKOUT
      # ==========================================================

      - name: Generate Breakout Animation
        run: |
          cat > generated/breakout-game.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 800 420">

            <rect width="800" height="420"
                  rx="28"
                  fill="#0d1117"/>

            <text x="400" y="45"
                  text-anchor="middle"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="28"
                  font-weight="bold">
              BREAKOUT
            </text>

            <!-- bricks -->

            <g fill="#b56cff">

              <rect x="100" y="80" width="100" height="28" rx="5"/>
              <rect x="215" y="80" width="100" height="28" rx="5"/>
              <rect x="330" y="80" width="100" height="28" rx="5"/>
              <rect x="445" y="80" width="100" height="28" rx="5"/>
              <rect x="560" y="80" width="100" height="28" rx="5"/>

            </g>

            <g fill="#ffffff">

              <rect x="100" y="120" width="100" height="28" rx="5"/>
              <rect x="215" y="120" width="100" height="28" rx="5"/>
              <rect x="330" y="120" width="100" height="28" rx="5"/>
              <rect x="445" y="120" width="100" height="28" rx="5"/>
              <rect x="560" y="120" width="100" height="28" rx="5"/>

            </g>

            <!-- ball -->

            <circle cx="400" cy="210"
                    r="9"
                    fill="#b56cff">

              <animate
                attributeName="cx"
                values="400;620;180;400"
                dur="3s"
                repeatCount="indefinite"/>

              <animate
                attributeName="cy"
                values="210;270;180;210"
                dur="3s"
                repeatCount="indefinite"/>

            </circle>

            <!-- paddle -->

            <rect x="325" y="330"
                  width="150"
                  height="18"
                  rx="9"
                  fill="#ffffff">

              <animate
                attributeName="x"
                values="325;500;150;325"
                dur="3s"
                repeatCount="indefinite"/>

            </rect>

            <text x="400" y="390"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-family="monospace"
                  font-size="14">
              SCORE 004820 • LEVEL 03
            </text>

          </svg>
          EOF


      # ==========================================================
      # GAME HUD
      # ==========================================================

      - name: Generate Game HUD
        run: |
          cat > generated/game-hud.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 1000 300">

            <rect width="1000" height="300"
                  rx="28"
                  fill="#0d1117"/>

            <rect x="80" y="55"
                  width="840" height="190"
                  rx="20"
                  fill="#161b22"
                  stroke="#30363d"/>

            <text x="120" y="105"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="24">
              PLAYER: FARREL
            </text>

            <text x="120" y="145"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="18">
              SCORE: 002320
            </text>

            <text x="120" y="180"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="18">
              LEVEL: CREATIVE
            </text>

            <text x="120" y="215"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="18">
              STATUS:
            </text>

            <text x="230" y="215"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="18">
              BUILDING
            </text>

            <circle cx="830" cy="150"
                    r="45"
                    fill="none"
                    stroke="#b56cff"
                    stroke-width="5">

              <animateTransform
                attributeName="transform"
                type="rotate"
                from="0 830 150"
                to="360 830 150"
                dur="3s"
                repeatCount="indefinite"/>

            </circle>

          </svg>
          EOF


      # ==========================================================
      # TERMINAL
      # ==========================================================

      - name: Generate Terminal Animation
        run: |
          cat > generated/terminal-boot.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 1000 300">

            <rect width="1000" height="300"
                  rx="28"
                  fill="#0d1117"/>

            <text x="55" y="55"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="22">
              $ farrel --boot
            </text>

            <text x="55" y="105"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="17">
              &gt; loading portfolio...
            </text>

            <text x="55" y="145"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="17">
              &gt; design ........ OK
            </text>

            <text x="55" y="180"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="17">
              &gt; coding ........ OK
            </text>

            <text x="55" y="215"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="17">
              &gt; game .......... OK
            </text>

            <text x="55" y="255"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="18">
              &gt; system_ready_

              <animate
                attributeName="opacity"
                values="1;0;1"
                dur="0.8s"
                repeatCount="indefinite"/>

            </text>

          </svg>
          EOF


      # ==========================================================
      # CREATIVE FLOW
      # ==========================================================

      - name: Generate Creative Flow
        run: |
          cat > generated/creative-flow.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 1000 300">

            <rect width="1000" height="300"
                  rx="28"
                  fill="#0d1117"/>

            <text x="500" y="55"
                  text-anchor="middle"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="28"
                  font-weight="bold">
              CREATIVE PIPELINE
            </text>

            <text x="100" y="150"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="18">
              DESIGN
            </text>

            <text x="300" y="150"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="18">
              FIGMA
            </text>

            <text x="500" y="150"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="18">
              3D
            </text>

            <text x="700" y="150"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="18">
              CODE
            </text>

            <text x="870" y="150"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="18">
              GAME
            </text>

            <path d="M160 145H260
                     M360 145H460
                     M560 145H660
                     M760 145H830"
                  stroke="#b56cff"
                  stroke-width="4"
                  stroke-dasharray="20 20">

              <animate
                attributeName="stroke-dashoffset"
                from="0"
                to="-40"
                dur="1s"
                repeatCount="indefinite"/>

            </path>

          </svg>
          EOF


      # ==========================================================
      # UI ANIMATION
      # ==========================================================

      - name: Generate UI Animation
        run: |
          cat > generated/ui-animation.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 1000 300">

            <rect width="1000" height="300"
                  rx="28"
                  fill="#0d1117"/>

            <text x="500" y="60"
                  text-anchor="middle"
                  fill="#b56cff"
                  font-family="monospace"
                  font-size="28"
                  font-weight="bold">
              UI ANIMATION LAB
            </text>

            <rect x="100" y="115"
                  width="800"
                  height="35"
                  rx="17"
                  fill="#161b22"/>

            <rect x="100" y="115"
                  width="200"
                  height="35"
                  rx="17"
                  fill="#b56cff">

              <animate
                attributeName="width"
                values="100;700;300;800;100"
                dur="4s"
                repeatCount="indefinite"/>

            </rect>

            <text x="500" y="205"
                  text-anchor="middle"
                  fill="#ffffff"
                  font-family="monospace"
                  font-size="18">
              BUILDING INTERFACE...

              <animate
                attributeName="opacity"
                values="1;0.3;1"
                dur="1.5s"
                repeatCount="indefinite"/>

            </text>

          </svg>
          EOF


      # ==========================================================
      # OUTPUT BRANCH
      # ==========================================================

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-branch
          fetch-depth: 0


      # ==========================================================
      # COPY — TIDAK MENGHAPUS FILE LAMA
      # ==========================================================

      - name: Update animated SVG assets
        run: |
          cp generated/*.svg output-branch/


      # ==========================================================
      # COMMIT ONLY CHANGED SVG
      # ==========================================================

      - name: Commit animations
        working-directory: output-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.svg'

          if git diff --cached --quiet; then
            echo "No animation changes."
            exit 0
          fi

          git commit -m "Update animated portfolio assets"

          git push origin HEAD:output
