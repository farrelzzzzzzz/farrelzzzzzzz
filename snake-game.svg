<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 360">

  <rect width="700" height="360"
        rx="28"
        fill="#0d1117"/>

  <text x="350" y="45"
        text-anchor="middle"
        fill="#b56cff"
        font-family="monospace"
        font-size="27"
        font-weight="bold">
    SNAKE GAME
  </text>

  <rect x="100" y="75"
        width="500"
        height="230"
        rx="10"
        fill="#161b22"
        stroke="#30363d"
        stroke-width="2"/>

  <!-- food -->

  <circle cx="500" cy="130"
          r="9"
          fill="#b56cff">

    <animate
      attributeName="r"
      values="7;12;7"
      dur="0.8s"
      repeatCount="indefinite"/>

  </circle>

  <!-- snake -->

  <rect x="160" y="220"
        width="30"
        height="30"
        rx="5"
        fill="#ffffff">

    <animate
      attributeName="x"
      values="160;220;280;340;400;460;400;340;280;220;160"
      dur="6s"
      repeatCount="indefinite"/>

  </rect>

  <rect x="130" y="220"
        width="30"
        height="30"
        rx="5"
        fill="#b56cff">

    <animate
      attributeName="x"
      values="130;190;250;310;370;430;370;310;250;190;130"
      dur="6s"
      repeatCount="indefinite"/>

  </rect>

  <rect x="100" y="220"
        width="30"
        height="30"
        rx="5"
        fill="#8b949e">

    <animate
      attributeName="x"
      values="100;160;220;280;340;400;340;280;220;160;100"
      dur="6s"
      repeatCount="indefinite"/>

  </rect>

  <text x="350" y="335"
        text-anchor="middle"
        fill="#8b949e"
        font-family="monospace"
        font-size="14">
    SCORE 002320 • PLAYER 1
  </text>

</svg>
