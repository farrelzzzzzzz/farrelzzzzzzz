<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 400">

  <rect width="800" height="400"
        rx="28"
        fill="#0d1117"/>

  <text x="400" y="45"
        text-anchor="middle"
        fill="#b56cff"
        font-family="monospace"
        font-size="28"
        font-weight="bold">
    PONG
  </text>

  <rect x="70" y="75"
        width="660"
        height="270"
        rx="10"
        fill="#161b22"
        stroke="#30363d"
        stroke-width="2"/>

  <!-- center line -->

  <path d="M400 85 V335"
        stroke="#30363d"
        stroke-width="3"
        stroke-dasharray="12 12"/>

  <!-- paddles -->

  <rect x="95" y="180"
        width="15"
        height="70"
        rx="5"
        fill="#ffffff">

    <animate
      attributeName="y"
      values="100;245;150;100"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>

  <rect x="690" y="180"
        width="15"
        height="70"
        rx="5"
        fill="#b56cff">

    <animate
      attributeName="y"
      values="245;100;220;245"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>

  <!-- ball -->

  <circle cx="400" cy="210"
          r="9"
          fill="#b56cff">

    <animate
      attributeName="cx"
      values="120;680;120"
      dur="2.4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="cy"
      values="210;110;280;210"
      dur="2.4s"
      repeatCount="indefinite"/>

  </circle>

  <text x="400" y="375"
        text-anchor="middle"
        fill="#8b949e"
        font-family="monospace"
        font-size="14">
    PLAYER 01     07 : 05     PLAYER 02
  </text>

</svg>
